name: Test

on: [pull_request, push]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Unpack action
        run: python tools/unpack.py

      - name: Run pytest
        run: python -m pytest tests/
